name: Toutiao Body Image Check

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: render
        options: [render, inspect-upload, upload-preview, ai-upload-preview]
      free_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      TZ: Asia/Shanghai
      TOUTIAO_PUBLISH_HEADLESS: '1'
      TOUTIAO_PUBLISH_CHANNEL: chromium
      FREE_IMAGE_CHECK: ${{ inputs.free_only == true && '1' || '0' }}
      IMAGE_API_KEY: ${{ inputs.mode == 'ai-upload-preview' && inputs.free_only != true && (secrets.IMAGE_API_KEY || secrets.OPENAI_API_KEY) || '' }}
      IMAGE_BASE_URL: ${{ inputs.mode == 'ai-upload-preview' && inputs.free_only != true && (secrets.IMAGE_BASE_URL || secrets.OPENAI_BASE_URL) || '' }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_REQUEST_TIMEOUT_SECONDS: '180'
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.mode == 'ai-upload-preview' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_AI_TOKEN: ${{ inputs.mode == 'ai-upload-preview' && secrets.CLOUDFLARE_AI_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore cloud browser session for read-only inspection
        if: inputs.mode != 'render'
        uses: actions/cache/restore@v4
        with:
          path: .runtime/
          key: image-inspect-${{ github.run_id }}
          restore-keys: browser-profile-main-robot-notes-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install image renderer and Chinese fonts
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render archived article body images without publishing
        run: python scripts/check_toutiao_body_images.py --mode "$CHECK_MODE"
        env:
          CHECK_MODE: ${{ inputs.mode || 'render' }}
      - name: Save image preview and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-body-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/automation/toutiao_body_image_check/
          if-no-files-found: error
          retention-days: 14
