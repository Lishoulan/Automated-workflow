automation:
  default_topic_rank: 1
  daily_run_times:
  - 09:00
  weekend_run_times:
  - '10:00'
  archive_outputs: true
  archive_dirname: runs
  selected_topic_basename: selected_topic
  # ⚠️ 2026-09-19：本地通道的「让位云端」时间闸。
  #
  # 两个通道的 publish_history **互不可见**：共享状态只能让本地看见"云端已发过"，
  # 没法让云端看见本地。所以本地若在云端窗口之前抢先发布，云端当天还会再发一篇 ——
  # **同一个号一天发两篇重复内容**。
  #
  # 本字段默认是 -1（不限制，云端 CI 必须用 -1），而 config.yaml 一直没设它，
  # 于是本地 07:00/09:30/12:30/15:30/18:00 这 5 个计划任务**全都在抢发**。
  # 云端定时恢复后必须显式设成 21：本地在这些时段只做采集与生成、不发布，
  # 由 21:30 那个任务作为"云端当天没发成功"的兜底。
  local_fallback_after_hour: 21
revenue_optimization:
  enabled: true
  lookback_days: 30
  min_samples: 10
  weak_rpm_threshold: 0.0
  weak_read_rate_threshold: 3.0
  cooldown_weak_ratio: 0.5
  stop_weak_ratio: 0.8
  cooldown_penalty: 12
review:
  auto_prepare: true
  min_overall_score: 72
  max_ai_risk: 45
  min_auto_publish_overall_score: 70
  max_auto_publish_ai_risk: 42
  min_auto_publish_validation_score: 70
  min_auto_publish_readiness_score: 60
  hot_topic_min_auto_publish_overall_score: 65
  hot_topic_max_auto_publish_ai_risk: 50
  hot_topic_min_auto_publish_readiness_score: 50
  publish_dirname: publish
compliance:
  aigc_declaration_enabled: true
  max_daily_posts: 1
  draft_only_mode: false
  anti_ai_flavor:
    banned_words:
    - 综上所述
    - 不可否认
    - 双刃剑
    - 值得关注的是
    - 换言之
    - 深入探讨
    - 如前所述
    - 值得注意的是
    - 不难发现
    - 由此可见
    - 众所周知
    - 毋庸置疑
    - 总而言之
    - 归根结底
    - 从某种程度上说
    style_rules:
    - 使用短句和主动语态，避免大段学术化复杂长句
    - 采用科技媒体记者的第一人称观察视角（如'笔者认为'、'在现场看到'）
    - 穿插具体的、未经AI抽象化的原始数据（如'同比下滑14.2%'，而非'大幅下滑'）
    - 每段不超过3个句子，段落之间用事实或数据衔接
    - 避免使用排比句和对称结构
  proxy_server: ''
  account_login_interval_seconds: 300
  account_switch_interval_seconds: 60
