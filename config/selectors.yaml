# Centralized selector registry for all platform RPA automation.
# Organized by platform and page/dialog.
# When a platform updates its UI, only this file needs to change.

# ========================================================================
# WeChat (微信公众号)
# ========================================================================
wechat:
  login_page:
    username_input:
      - "input[name='account']"
      - "input[type='text']"
    password_input:
      - "input[name='password']"
      - "input[type='password']"
    login_button:
      - "a.btn_login"
      - "button:has-text('登录')"
