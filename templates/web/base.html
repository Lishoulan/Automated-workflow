<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}手蓝内容工厂{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <p class="eyebrow">SHOULAN MATRIX</p>
        <h1>手蓝内容工厂</h1>
        <p class="subtle">多账号内容生成、审核、发布与状态管理后台</p>
      </div>

      <div class="sidebar-card">
        <p class="card-label">当前账号</p>
        <strong>{{ account_label }}</strong>
        <p class="subtle account-key">{{ account_key }}</p>
        <form method="get" action="/" class="stack-form compact-form">
          <label>
            <span>切换账号</span>
            <select name="account" onchange="this.form.submit()">
              {% for item in account_options %}
              <option value="{{ item.key }}" {% if item.key == account_key %}selected{% endif %}>{{ item.label }} | {{ item.key }}</option>
              {% endfor %}
            </select>
          </label>
        </form>
      </div>

      <nav class="nav">
        <a href="/?{{ account_query }}" class="nav-link{% if current_path == '/' %} active{% endif %}">账号管理</a>
        <a href="/dashboard?{{ account_query }}" class="nav-link{% if current_path == '/dashboard' %} active{% endif %}">单账号看板</a>
        <a href="/topics?{{ account_query }}" class="nav-link{% if current_path == '/topics' %} active{% endif %}">热点池</a>
        <a href="/runs?{{ account_query }}" class="nav-link{% if current_path == '/runs' %} active{% endif %}">归档批次</a>
        <a href="/published?{{ account_query }}" class="nav-link{% if current_path == '/published' %} active{% endif %}">已发布预览</a>
      </nav>

      <div class="sidebar-card">
        <p class="card-label">默认风格</p>
        <strong>{{ default_style }}</strong>
      </div>
    </aside>

    <main class="content">
      {% if message %}
      <div class="flash flash-{{ level }}">
        {{ message }}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
