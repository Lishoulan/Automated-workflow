  # WeChat constant tuples
  session_ready_markers:
    - "草稿箱"
    - "新建图文"
    - "素材管理"
    - "发表记录"
    - "首页"
  login_url_markers:
    - "/cgi-bin/loginpage"
    - "/cgi-bin/home?t=home/login"
  dismiss_keywords:
    - "切换账号"
    - "实名"
    - "退出登录"
    - "插件"
    - "安全隐患"
  dismiss_actions:
    - "我知道了"
    - "取消"
    - "关闭"
  publish_confirm_texts:
    - "确定"
    - "确认"
    - "继续发布"
    - "确认发布"
    - "发表"
  publish_button_texts:
    - "发表"
    - "发布"
    - "群发"
    - "提交"
    - "确认发布"
  success_markers:
    - "发表成功"
    - "发布成功"
    - "群发成功"
    - "已发送"
    - "发布完成"

