name: Daily Run

on:
  # ✅ 定时已恢复（2026-09-19）。停用期间（09-19 凌晨）列出的两个障碍都已解决：
  #
  #   1. 「选题只有标题、没有正文素材」→ 已加 `material_search_service`
  #      （Bing 搜索 → 抓真实报道 → 抽正文），实测单条选题能补到 2000~5000 字真实素材。
  #      并且**抓不到素材就不发**：换下一条选题重试，全抓不到则本次运行退出。
  #   2. 「标题池为空」→ 根因是标题提示词把账号写死成「科技分析号」、
  #      兜底模板又全是产业句式。已按 `content_domain` 领域化，
  #      实测标题池变为「模型 18 条 → 合格 18 条、兜底 0 条」。
  #
  # 发布路径已实机验证：真实链路跑到 `Review approved` 并导出发布包
  # （见 docs/ACCOUNT_PIVOT_STORY.md 第四节的实测记录）。
  #
  # 仍可手动触发（workflow_dispatch）做单次联调。
  #
  schedule:
    # 工作日早间 Beijing 07:00 (周一-周五) = UTC 23:00 前一天 (周日-周四)
    - cron: '0 23 * * 0-4'
    # 工作日午间 Beijing 12:30 (周一-周五) = UTC 04:30
    - cron: '30 4 * * 1-5'
    # 工作日傍晚 Beijing 18:00 (周一-周五) = UTC 10:00
    - cron: '0 10 * * 1-5'
    # 周末早间 Beijing 08:00 (周六-周日) = UTC 00:00
    - cron: '0 0 * * 0,6'
    # 每日统一发送通知汇总 Beijing 22:00 = UTC 14:00
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Account key (e.g. default, politics_notes)'
        required: false
        default: 'default'
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'true'
      fast_mode:
        description: 'Fast mode (true/false)'
        required: false
        default: 'true'
      publish_toutiao:
        description: 'Publish to Toutiao instead of draft-only (true/false)'
        required: false
        default: 'false'
      publish_wechat_via_135:
        description: 'Legacy input retained for compatibility; 135 Editor is disabled'
        required: false
        default: 'false'
      topic_title:
        description: 'Optional topic title or keyword for this manual run'
        required: false
        default: ''
      image_diagnostic:
        description: 'Run a standalone image API diagnostic after content generation (true/false)'
        required: false
        default: 'false'

concurrency:
  # The report-only schedule must not cancel an active content/publish run.
  group: daily-run-${{ github.ref }}-${{ github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && 'report' || 'content' }}
  cancel-in-progress: true

permissions:
  # write 是给「跨通道发布状态」用的：云端把当日发布结果提交到 publish-state
  # 分支，本地通道才能看见「云端今天已经发过」，避免同一天各发一篇。
  # 只往该分支写一个小 JSON，不碰 main。
  contents: write

jobs:
  daily-run:
    # The 22:00 schedule is report-only; do not start the content pipeline.
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule != '0 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      # 主 job 运行状态（success / blocked / degraded_to_draft / unknown）
      run-status: ${{ steps.extract-status.outputs.run-status }}
      # 运行账号，供备用 job 复用
      run-account: ${{ steps.extract-status.outputs.run-account }}

    env:
      # ---- 敏感配置（从 GitHub Secrets 读取） ----
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_BASE_URL && secrets.OPENAI_MODEL || '' }}
      OPENAI_TEMPERATURE: ${{ secrets.OPENAI_TEMPERATURE || '0.7' }}
      # 标题环节单独使用强模型（title_agent.py 读该变量；为空则沿用正文模型）。
      # 2026-09-15 本地实测：glm-4.6 的标题能过 RULE_006/007/009，glm-4-flash 常被全过滤。
      # 2026-09-17 起云端也启用，配合 TITLE_MODEL_EXPERIMENT 做一次对照实验。
      #
      # ⚠️ 2026-09-18 修正：glm-4.6 是**付费模型**，本账号已「余额不足或无可用资源包」。
      # 云端每次调用都被拒 → TitleAgent 池全灭 → 静默退回硬编码兜底模板，
      # 这正是 9-16/9-17 发布出「工信部推动机器人80%：具身智能如何实测」的原因。
      # 离线实测（.runtime/free_model_title_probe.py）：glm-4-flash 生成 19 条标题、
      # 14 条过 ArticleQualityChecker（74%），并非「常被全过滤」。
      # 故云端标题模型改为免费模型，与正文同模型（同模型时 title_agent 不再另建客户端）。
      OPENAI_TITLE_MODEL: ${{ secrets.OPENAI_TITLE_MODEL || 'glm-4-flash' }}
      # 纯标记，不参与业务逻辑，仅用于区分实验前后的运行。
      TITLE_MODEL_EXPERIMENT: glm-4-flash-20260918

      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.OPENAI_API_KEY }}
      IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL || secrets.OPENAI_BASE_URL }}

      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}

      MD2WECHAT_API_KEY: ${{ secrets.MD2WECHAT_API_KEY }}

      WECHAT_SERV00_PROXY_URL: ${{ secrets.WECHAT_SERV00_PROXY_URL }}
      WECHAT_SERV00_PROXY_SECRET: ${{ secrets.WECHAT_SERV00_PROXY_SECRET }}

      TOUTIAO_PROXY_SERVER: ${{ secrets.TOUTIAO_PROXY_SERVER }}

      # ---- 非敏感配置（直接硬编码默认值） ----
      PYTHONUTF8: "1"
      # 时区固定为北京时间：让 datetime.now() 的「今日」与头条后台一致。
      # runner 默认是 UTC，会导致跨 0-8 点的时段把「今天」算成前一天
      # （count_today_published 的每日 1 篇上限由此失效/误判）。
      TZ: Asia/Shanghai
      TOUTIAO_ACCOUNT: default
      # 云端是内容生产通道，必须不设「本地兜底窗口」限制。
      # >=0 会让本地在当天该小时前不发布（见 services/cross_channel_state.py）。
      TOUTIAO_LOCAL_FALLBACK_AFTER_HOUR: "-1"

      # Image generation: image2 cover first; exact statistical inserts stay local.
      IMAGE_BACKEND: ${{ secrets.IMAGE_BACKEND || 'image2' }}
      IMAGE_API_MODE: ${{ secrets.IMAGE_API_MODE || 'images' }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_MAX_ASSETS: ${{ secrets.IMAGE_MAX_ASSETS || '2' }}
      IMAGE_COVER_SIZE: ${{ secrets.IMAGE_COVER_SIZE || '1536x1024' }}
      IMAGE_INFOGRAPHIC_SIZE: ${{ secrets.IMAGE_INFOGRAPHIC_SIZE || '1024x1536' }}
      IMAGE_QUALITY: ${{ secrets.IMAGE_QUALITY || 'high' }}
      IMAGE_STYLE: ${{ secrets.IMAGE_STYLE || 'vivid' }}
      IMAGE_BACKGROUND: ${{ secrets.IMAGE_BACKGROUND || 'opaque' }}
      IMAGE_REQUEST_TIMEOUT_SECONDS: ${{ secrets.IMAGE_REQUEST_TIMEOUT_SECONDS || '180' }}
      IMAGE_FALLBACK_TO_RENDERER: "1"

      # 内容生成
      ARTICLE_WORD_TARGET: ${{ secrets.ARTICLE_WORD_TARGET || '1800' }}
      MAX_INPUT_CHARS: ${{ secrets.MAX_INPUT_CHARS || '16000' }}
      BRAND_NAME: ${{ secrets.BRAND_NAME || '' }}
      INDUSTRY_FOCUS: ${{ secrets.INDUSTRY_FOCUS || '' }}
      TARGET_PLATFORM: ${{ secrets.TARGET_PLATFORM || 'all' }}
      TARGET_AUDIENCE: ${{ secrets.TARGET_AUDIENCE || '' }}
      DEFAULT_STYLE: ${{ secrets.DEFAULT_STYLE || 'deep_industry_analysis' }}
      TITLE_COUNT: ${{ secrets.TITLE_COUNT || '20' }}
      RECOMMENDED_TITLE_COUNT: ${{ secrets.RECOMMENDED_TITLE_COUNT || '3' }}
      CACHE_SIMILARITY_THRESHOLD: ${{ secrets.CACHE_SIMILARITY_THRESHOLD || '0.82' }}
      LOG_LEVEL: INFO

      # 头条发布（云端自动发布，草稿模式优先）
      TOUTIAO_PUBLISH_ENABLED: "1"
      TOUTIAO_AUTO_PUBLISH: "1"
      TOUTIAO_DRAFT_ONLY: "0"
      TOUTIAO_PUBLISH_DRAFT_ONLY: "0"
      TOUTIAO_MAX_DAILY_POSTS: "1"
      TOUTIAO_MAX_DAILY_TOPIC_ATTEMPTS: ${{ secrets.TOUTIAO_MAX_DAILY_TOPIC_ATTEMPTS || '6' }}
      TOUTIAO_AIGC_DECLARATION_ENABLED: "1"
      TOUTIAO_PUBLISH_PLATFORM: toutiao
      TOUTIAO_PUBLISH_BASE_URL: https://mp.toutiao.com/
      TOUTIAO_PUBLISH_URL: https://mp.toutiao.com/profile_v4/graphic/publish
      TOUTIAO_BROWSER_PROFILE_DIR: .runtime/toutiao_profile
      TOUTIAO_PUBLISH_CHANNEL: chromium
      TOUTIAO_PUBLISH_HEADLESS: "1"
      TOUTIAO_PUBLISH_TIMEOUT_MS: ${{ secrets.TOUTIAO_PUBLISH_TIMEOUT_MS || '15000' }}
      TOUTIAO_PUBLISH_HISTORY_FILE: publish_history.json
      TOUTIAO_ALLOW_DUPLICATE_TOPICS: "0"
      TOUTIAO_TITLE_MAX_LENGTH: "30"
      TOUTIAO_PUBLISH_COVER_MODE: ${{ secrets.TOUTIAO_PUBLISH_COVER_MODE || 'single' }}
      TOUTIAO_INLINE_IMAGES_ENABLED: ${{ secrets.TOUTIAO_INLINE_IMAGES_ENABLED || '1' }}

      # 微信发布（云端只生成内容，不发布，发布留给本地）
      WECHAT_ENABLED: "0"
      WECHAT_AUTO_PUBLISH: "0"
      WECHAT_ACCOUNT_NAME: ${{ secrets.WECHAT_ACCOUNT_NAME || '' }}
      WECHAT_AUTHOR_NAME: ${{ secrets.WECHAT_AUTHOR_NAME || '手蓝' }}
      WECHAT_BASE_URL: https://mp.weixin.qq.com/
      WECHAT_API_BASE_URL: https://api.weixin.qq.com
      WECHAT_TITLE_MAX_LENGTH: "64"
      WECHAT_DIGEST_MAX_LENGTH: "120"
      WECHAT_HISTORY_FILENAME: wechat_publish_history.json
      WECHAT_COVER_STRATEGY: ${{ secrets.WECHAT_COVER_STRATEGY || 'text_cover' }}
      WECHAT_LAYOUT_BACKEND: ${{ secrets.WECHAT_LAYOUT_BACKEND || 'builtin' }}
      WECHAT_MD2WECHAT_ENABLED: ${{ secrets.WECHAT_MD2WECHAT_ENABLED || '0' }}
      WECHAT_SERV00_PROXY_ENABLED: ${{ secrets.WECHAT_SERV00_PROXY_ENABLED || '0' }}
      # 135 Editor is intentionally disabled. Legacy secrets must not re-enable it.
      WECHAT_EDITOR_135_ENABLED: "0"
      WECHAT_BROWSER_PROFILE_DIR: .runtime/wechat_profile

      # 抖音发布（云端只做内容生成，发布由本地脚本完成）
      DOUYIN_ENABLED: "0"
      DOUYIN_AUTO_PUBLISH: "0"
      DOUYIN_NICHE: ${{ secrets.DOUYIN_NICHE || '' }}
      DOUYIN_PUBLISH_MODE: browser
      DOUYIN_DAILY_POST_TARGET: ${{ secrets.DOUYIN_DAILY_POST_TARGET || '3' }}
      DOUYIN_BASE_URL: https://creator.douyin.com/
      DOUYIN_PUBLISH_URL: https://creator.douyin.com/creator-micro/content/upload
      DOUYIN_BROWSER_PROFILE_DIR: .runtime/douyin_profile
      DOUYIN_PUBLISH_CHANNEL: chromium
      DOUYIN_PUBLISH_HEADLESS: "1"
      DOUYIN_PUBLISH_TIMEOUT_MS: ${{ secrets.DOUYIN_PUBLISH_TIMEOUT_MS || '20000' }}
      DOUYIN_PUBLISH_HISTORY_FILE: douyin_publish_history.json
      DOUYIN_TITLE_MAX_LENGTH: "30"
      DOUYIN_CAPTION_MAX_LENGTH: "220"
      DOUYIN_MAX_IMAGES: "3"

      # MD2WeChat
      MD2WECHAT_BASE_URL: ${{ secrets.MD2WECHAT_BASE_URL || 'https://www.md2wechat.com/api/v1' }}
      MD2WECHAT_THEME: ${{ secrets.MD2WECHAT_THEME || 'default' }}
      MD2WECHAT_FONT_SIZE: ${{ secrets.MD2WECHAT_FONT_SIZE || 'medium' }}
      MD2WECHAT_CONVERT_VERSION: ${{ secrets.MD2WECHAT_CONVERT_VERSION || 'v1' }}
      MD2WECHAT_FALLBACK_TO_BUILTIN: "1"

      # 快速模式
      TOUTIAO_FAST_MODE: ${{ secrets.TOUTIAO_FAST_MODE || '0' }}
      TOUTIAO_SKIP_IMAGE_GENERATION: ${{ secrets.TOUTIAO_SKIP_IMAGE_GENERATION || '0' }}
      TOUTIAO_SKIP_REVIEW_AGENT: ${{ secrets.TOUTIAO_SKIP_REVIEW_AGENT || '0' }}
      TOUTIAO_SKIP_PUBLISH_REVIEW: ${{ secrets.TOUTIAO_SKIP_PUBLISH_REVIEW || '0' }}
      TOUTIAO_REVIEW_MIN_OVERALL_SCORE: ${{ secrets.TOUTIAO_REVIEW_MIN_OVERALL_SCORE || '72' }}
      TOUTIAO_REVIEW_MAX_AI_RISK: ${{ secrets.TOUTIAO_REVIEW_MAX_AI_RISK || '45' }}
      # 自动发布的四个门槛必须与本地 .env 完全一致，否则云端会挑出和本地不同的稿子
      # （历史差异：云端 overall>=80 / readiness>=70，本地是 70 / 60）。
      # 每次运行的日志里会打印实际生效值（Report effective auto-publish gate）。
      TOUTIAO_AUTO_PUBLISH_MIN_OVERALL_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_OVERALL_SCORE || '70' }}
      TOUTIAO_AUTO_PUBLISH_MAX_AI_RISK: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MAX_AI_RISK || '40' }}
      TOUTIAO_AUTO_PUBLISH_MIN_VALIDATION_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_VALIDATION_SCORE || '80' }}
      TOUTIAO_AUTO_PUBLISH_MIN_READINESS_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_READINESS_SCORE || '60' }}
      TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_OVERALL_SCORE: ${{ secrets.TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_OVERALL_SCORE || '65' }}
      TOUTIAO_HOT_TOPIC_MAX_AUTO_PUBLISH_AI_RISK: ${{ secrets.TOUTIAO_HOT_TOPIC_MAX_AUTO_PUBLISH_AI_RISK || '50' }}
      TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_READINESS_SCORE: ${{ secrets.TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_READINESS_SCORE || '50' }}
      
      # ---- 洞察增强功能配置 ----
      TOUTIAO_ENHANCED_INSIGHTS_ENABLED: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_ENABLED || '1' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_MULTI_SOURCE: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_MULTI_SOURCE || '0' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_HISTORICAL: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_HISTORICAL || '0' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_DATA_MINING: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_DATA_MINING || '1' }}
      TOUTIAO_EXPERT_COUNCIL_ENABLED: ${{ secrets.TOUTIAO_EXPERT_COUNCIL_ENABLED || '1' }}

      # ---- 新平台发布配置（AiToEarn 集成） ----
      BILIBILI_ENABLED: ${{ secrets.BILIBILI_ENABLED || '0' }}
      ZHIHU_ENABLED: ${{ secrets.ZHIHU_ENABLED || '0' }}
      WEIBO_ENABLED: ${{ secrets.WEIBO_ENABLED || '0' }}
      XIAOHONGSHU_ENABLED: ${{ secrets.XIAOHONGSHU_ENABLED || '0' }}

      # ---- 互动 Agent 配置 ----
      ENGAGEMENT_ENABLED: ${{ secrets.ENGAGEMENT_ENABLED || '0' }}
      ENGAGEMENT_MAX_DAILY_LIKES: ${{ secrets.ENGAGEMENT_MAX_DAILY_LIKES || '50' }}
      ENGAGEMENT_MAX_DAILY_COMMENTS: ${{ secrets.ENGAGEMENT_MAX_DAILY_COMMENTS || '20' }}
      ENGAGEMENT_COMMENT_STYLE: ${{ secrets.ENGAGEMENT_COMMENT_STYLE || 'professional' }}

      # ---- 变现系统配置 ----
      MONETIZATION_ENABLED: ${{ secrets.MONETIZATION_ENABLED || '0' }}
      CPS_ENABLED: ${{ secrets.CPS_ENABLED || '0' }}
      CPE_ENABLED: ${{ secrets.CPE_ENABLED || '0' }}

      # ---- 矩阵运营配置 ----
      MATRIX_ENABLED: ${{ secrets.MATRIX_ENABLED || '0' }}

      # ---- 性能数据回采配置 ----
      PERFORMANCE_COLLECT_ENABLED: ${{ secrets.PERFORMANCE_COLLECT_ENABLED || '1' }}

      # ---- 月度回顾与迭代建议配置 ----
      # 默认开启，读取 30 天发布数据生成回顾报告、迭代建议与演化提案
      MONTHLY_REVIEW_ENABLED: ${{ secrets.MONTHLY_REVIEW_ENABLED || '1' }}

      # ---- Docker AI 服务配置 ----
      # ⚠️ 2026-09-18：云端整体关闭这三个 Docker 服务，理由是三处「死配置 + 纯浪费」：
      #
      # 1. DeerFlow 与 Prompt-Optimizer **从不参与内容生成**。全仓库对
      #    DeerFlowClient / PromptOptimizerClient 的引用只出现在
      #    app_service.check_ai_services_health() 里，即它们只被「健康检查」调用，
      #    没有任何 agent 用它们做实际工作。启动它们只是白烧 Actions 分钟数。
      # 2. Letta 只提供可选的记忆上下文（agent_workflow._get_memory_context），
      #    失败时非阻塞降级为空字符串。本地流水线关闭 Letta 同样跑出 overall=87。
      # 3. 下面「Ensure Letta agent exists」用的模型是 `deepseek-v4-flash`，
      #    却配在智谱的 OPENAI_BASE_URL 上 —— 又一个模型名与端点错配的死配置。
      #
      # 省下的是每个 job 的：拉取 letta/prompt-optimizer/deerflow/postgres 镜像
      # + docker compose up + `sleep 10` + 三次健康探测，实测每次运行 1~2 分钟。
      # 若日后确实要用 Letta 记忆，把这三个开关设回 "1" 并恢复 Docker 步骤即可。
      DEERFLOW_ENABLED: "0"
      DEERFLOW_BASE_URL: "http://localhost:8001"
      LETTA_ENABLED: "0"
      LETTA_BASE_URL: "http://localhost:8283"
      LETTA_AGENT_ID: ${{ secrets.LETTA_AGENT_ID || '' }}
      PROMPT_OPTIMIZER_ENABLED: "0"
      PROMPT_OPTIMIZER_BASE_URL: "http://localhost:8501"
      RUFLO_ENABLED: "0"

      # ---- 发布结果通知 ----
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      NOTIFY_DAILY_LIMIT: ${{ secrets.NOTIFY_DAILY_LIMIT || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve cloud runtime flags
        shell: bash
        env:
          WORKFLOW_TOPIC_TITLE: ${{ github.event.inputs.topic_title }}
        run: |
          normalize_bool() {
            case "${1,,}" in
              1|true|yes|on) echo "true" ;;
              *) echo "false" ;;
            esac
          }

          first_non_empty() {
            for value in "$@"; do
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            done
            return 1
          }

          EVENT_NAME="${{ github.event_name }}"
          INPUT_ACCOUNT="${{ github.event.inputs.account }}"
          INPUT_DRY_RUN="${{ github.event.inputs.dry_run }}"
          INPUT_FAST_MODE="${{ github.event.inputs.fast_mode }}"
          INPUT_PUBLISH_TOUTIAO="${{ github.event.inputs.publish_toutiao }}"

          SECRET_DEFAULT_ACCOUNT="${{ secrets.CLOUD_DEFAULT_ACCOUNT }}"
          SECRET_DEFAULT_DRY_RUN="${{ secrets.CLOUD_DRY_RUN }}"
          SECRET_DEFAULT_FAST_MODE="${{ secrets.CLOUD_FAST_MODE }}"
          SECRET_DEFAULT_PUBLISH_TOUTIAO="${{ secrets.CLOUD_TOUTIAO_AUTOPUBLISH }}"

          # ⚠️ 2026-09-21：定时的账号原来**只**由 Secret `CLOUD_DEFAULT_ACCOUNT`
          # 决定，而它是 `default`。后果是：云端定时一直在给 `default`（手蓝数据笔记）
          # 发文，`robot_notes`（手蓝人间故事）在云端**从来没有被定时跑过** ——
          # 它那些"云端运行成功"全部来自手动 workflow_dispatch。
          #
          # 而 Secret 的值在仓库里读不到、也审不了（`gh secret list` 只给名字），
          # 于是"云端到底在给哪个账号发文"这件事一直不透明。实测发现它的方式很偶然：
          # 看 publish-state 分支里的 entry key —— `2026-09-21::default`，
          # 而 robot_notes 是 `2026-09-19::robot-notes`。
          #
          # 现在改为：**仓库变量 `CLOUD_SCHEDULE_ACCOUNTS` 优先**（值可见、可审、可改），
          # 逗号分隔的账号列表；定时运行的账号数按 `github.run_number` 轮转，
          # 于是多个账号都能各自拿到定时名额，而 Secret 退化为兜底。
          #
          # 未设置该变量时行为与以前完全一致（用 Secret 里的 default account）。
          SCHEDULE_ACCOUNTS_RAW="${{ vars.CLOUD_SCHEDULE_ACCOUNTS }}"

          pick_schedule_account() {
            # 把逗号分隔列表规范化后，按 run_number 轮转取一个。
            local raw="$1"
            local normalized
            normalized="$(echo "$raw" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)"
            if [ -z "$normalized" ]; then
              return 1
            fi
            local count
            count="$(echo "$normalized" | wc -l | tr -d ' ')"
            if [ "$count" -le 0 ]; then
              return 1
            fi
            local index=$(( ${GITHUB_RUN_NUMBER:-0} % count ))
            echo "$normalized" | sed -n "$((index + 1))p"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ACCOUNT="$(first_non_empty "$INPUT_ACCOUNT" "$SECRET_DEFAULT_ACCOUNT" "default")"
            RUN_DRY_RUN="$(normalize_bool "$(first_non_empty "$INPUT_DRY_RUN" "$SECRET_DEFAULT_DRY_RUN" "false")")"
            RUN_FAST_MODE="$(normalize_bool "$(first_non_empty "$INPUT_FAST_MODE" "$SECRET_DEFAULT_FAST_MODE" "true")")"
            RUN_PUBLISH_TOUTIAO="$(normalize_bool "$(first_non_empty "$INPUT_PUBLISH_TOUTIAO" "$SECRET_DEFAULT_PUBLISH_TOUTIAO" "true")")"
            RUN_TOPIC_TITLE="${WORKFLOW_TOPIC_TITLE:-}"
          else
            SCHEDULED_ACCOUNT="$(pick_schedule_account "$SCHEDULE_ACCOUNTS_RAW" || true)"
            RUN_ACCOUNT="$(first_non_empty "$SCHEDULED_ACCOUNT" "$SECRET_DEFAULT_ACCOUNT" "default")"
            RUN_DRY_RUN="$(normalize_bool "$(first_non_empty "$SECRET_DEFAULT_DRY_RUN" "false")")"
            RUN_FAST_MODE="$(normalize_bool "$(first_non_empty "$SECRET_DEFAULT_FAST_MODE" "true")")"
            RUN_PUBLISH_TOUTIAO="$(normalize_bool "$(first_non_empty "$SECRET_DEFAULT_PUBLISH_TOUTIAO" "true")")"
            RUN_TOPIC_TITLE=""
            echo "Scheduled account resolution: CLOUD_SCHEDULE_ACCOUNTS='${SCHEDULE_ACCOUNTS_RAW}' run_number=${GITHUB_RUN_NUMBER:-0} -> RUN_ACCOUNT='${RUN_ACCOUNT}'"
          fi

          # Account offline kill switch. Keep scheduled collection and content
          # validation available, but never submit a Toutiao or WeChat post.
          # Remove this override only when the account is explicitly brought online.
          RUN_DRY_RUN="true"
          RUN_PUBLISH_TOUTIAO="false"

          # 135 Editor is retired for this workflow. Keep the legacy dispatch
          # input and Secret names compatible, but never enable the route.
          RUN_PUBLISH_WECHAT_VIA_135="false"

          TOUTIAO_AUTO_PUBLISH_VALUE="0"
          TOUTIAO_DRAFT_ONLY_VALUE="1"
          WECHAT_ENABLED_VALUE="0"
          WECHAT_AUTO_PUBLISH_VALUE="0"

          if [ "$RUN_DRY_RUN" = "true" ]; then
            RUN_PUBLISH_TOUTIAO="false"
            RUN_PUBLISH_WECHAT_VIA_135="false"
          fi

          if [ "$RUN_PUBLISH_TOUTIAO" = "true" ]; then
            TOUTIAO_AUTO_PUBLISH_VALUE="1"
            TOUTIAO_DRAFT_ONLY_VALUE="0"
          fi

          if [ "$RUN_PUBLISH_WECHAT_VIA_135" = "true" ]; then
            WECHAT_ENABLED_VALUE="1"
            WECHAT_AUTO_PUBLISH_VALUE="1"
          fi

          {
            echo "RUN_ACCOUNT=$RUN_ACCOUNT"
            echo "RUN_DRY_RUN=$RUN_DRY_RUN"
            echo "RUN_FAST_MODE=$RUN_FAST_MODE"
            echo "RUN_PUBLISH_TOUTIAO=$RUN_PUBLISH_TOUTIAO"
            echo "RUN_PUBLISH_WECHAT_VIA_135=$RUN_PUBLISH_WECHAT_VIA_135"
            echo "TOUTIAO_ACCOUNT=$RUN_ACCOUNT"
            echo "TOUTIAO_AUTO_PUBLISH=$TOUTIAO_AUTO_PUBLISH_VALUE"
            # TOUTIAO_DRAFT_ONLY is the legacy name kept for compatibility; the
            # settings loader only reads TOUTIAO_PUBLISH_DRAFT_ONLY. Emit both so
            # the intended value actually reaches PublishSettings.draft_only.
            echo "TOUTIAO_DRAFT_ONLY=$TOUTIAO_DRAFT_ONLY_VALUE"
            echo "TOUTIAO_PUBLISH_DRAFT_ONLY=$TOUTIAO_DRAFT_ONLY_VALUE"
            echo "WECHAT_ENABLED=$WECHAT_ENABLED_VALUE"
            echo "WECHAT_AUTO_PUBLISH=$WECHAT_AUTO_PUBLISH_VALUE"
            echo "RUN_TOPIC_TITLE<<__TOPIC_TITLE__"
            echo "$RUN_TOPIC_TITLE"
            echo "__TOPIC_TITLE__"
          } >> "$GITHUB_ENV"

          echo "Resolved cloud runtime flags:"
          echo "  account=$RUN_ACCOUNT"
          echo "  dry_run=$RUN_DRY_RUN"
          echo "  fast_mode=$RUN_FAST_MODE"
          echo "  publish_toutiao=$RUN_PUBLISH_TOUTIAO"
          echo "  publish_wechat_via_135=$RUN_PUBLISH_WECHAT_VIA_135"
          if [ -n "$RUN_TOPIC_TITLE" ]; then
            echo "  topic_title=$RUN_TOPIC_TITLE"
          fi

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve account runtime paths
        id: resolve-account-paths
        shell: bash
        run: |
          ACCOUNT_PATHS_FILE="$(mktemp)"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python - "$RUN_ACCOUNT" <<'PY' > "$ACCOUNT_PATHS_FILE"
          import sys
          from pathlib import Path

          from toutiao_content_factory.config import load_settings

          root = Path.cwd().resolve()
          settings = load_settings(root, account_key=sys.argv[1])

          def workspace_relative(path: Path) -> str:
              resolved = path if path.is_absolute() else root / path
              resolved = resolved.resolve()
              try:
                  return resolved.relative_to(root).as_posix()
              except ValueError:
                  return str(resolved)

          print(f"ACCOUNT_SLUG={settings.account_slug}")
          print(f"ACCOUNT_RUNTIME_DIR={workspace_relative(settings.account_runtime_dir)}")
          print(f"ACCOUNT_OUTPUT_DIR={workspace_relative(settings.output_dir)}")
          print(f"TOUTIAO_PROFILE_DIR={workspace_relative(Path(settings.publishing.user_data_dir))}")
          PY
          cat "$ACCOUNT_PATHS_FILE" >> "$GITHUB_ENV"
          cat "$ACCOUNT_PATHS_FILE" >> "$GITHUB_OUTPUT"
          set -a
          . "$ACCOUNT_PATHS_FILE"
          set +a
          rm -f "$ACCOUNT_PATHS_FILE"

          echo "Resolved account runtime paths:"
          echo "  slug=$ACCOUNT_SLUG"
          echo "  runtime=$ACCOUNT_RUNTIME_DIR"
          echo "  output=$ACCOUNT_OUTPUT_DIR"
          echo "  toutiao_profile=$TOUTIAO_PROFILE_DIR"

      - name: Report effective auto-publish gate
        # 审核门槛有 env / Secret / config.yaml 三层覆盖，云端和本地最容易在这里分叉。
        # 每次运行都把最终生效的数值打进日志，避免「云端为什么没自动发」只能靠猜。
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python - "$RUN_ACCOUNT" <<'PY'
          import sys
          from datetime import datetime
          from pathlib import Path

          from toutiao_content_factory.config import load_settings
          from toutiao_content_factory.services.compliance_service import get_max_daily_posts

          settings = load_settings(Path.cwd().resolve(), account_key=sys.argv[1])
          review = settings.review
          publishing = settings.publishing
          now = datetime.now()
          print(f"[auto-publish gate] clock  : now={now.isoformat(timespec='seconds')} "
                f"today={now.strftime('%Y-%m-%d')} tz={now.astimezone().tzname()}")
          print(
              "[auto-publish gate] normal : "
              f"overall>={review.min_auto_publish_overall_score} "
              f"ai_risk<={review.max_auto_publish_ai_risk} "
              f"validation>={review.min_auto_publish_validation_score} "
              f"readiness>={review.min_auto_publish_readiness_score}"
          )
          print(
              "[auto-publish gate] hot    : "
              f"overall>={review.hot_topic_min_auto_publish_overall_score} "
              f"ai_risk<={review.hot_topic_max_auto_publish_ai_risk} "
              f"readiness>={review.hot_topic_min_auto_publish_readiness_score}"
          )
          print(
              "[auto-publish gate] publish: "
              f"enabled={publishing.enabled} auto_publish={publishing.auto_publish} "
              f"draft_only={publishing.draft_only} max_daily={get_max_daily_posts('toutiao')}"
          )
          PY

      - name: Probe LLM endpoint
        # 云端最隐蔽的故障模式：接口返回 HTTP 200，但 message.content 是一张 HTML 页面，
        # 于是每个 Agent 都静默退化成「本地兜底策略」，最终以
        # "Daily workflow did not produce any runnable candidates" 收场——
        # 日志里看不出是模型接口的问题。每次运行都打一次探针，把真相暴露出来。
        continue-on-error: true
        run: |
          redact() {
            sed -E 's/(sk-|Bearer )[A-Za-z0-9._-]{6,}/\1***/g; s/("(api_)?key"[[:space:]]*:[[:space:]]*")[^"]*/\1***/g'
          }
          echo "[llm-probe] host: $(printf '%s' "$OPENAI_BASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          echo "[llm-probe] model: $OPENAI_MODEL"
          echo "[llm-probe] title_model: ${OPENAI_TITLE_MODEL:-<unset>}"
          echo "[llm-probe] title_model_experiment: ${TITLE_MODEL_EXPERIMENT:-<unset>}"
          BODY_FILE="$(mktemp)"
          CURL_ERR="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
            -X POST "${OPENAI_BASE_URL%/}/chat/completions" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${OPENAI_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":8}" \
            2>"$CURL_ERR" || true)"
          echo "[llm-probe] http_status=${HTTP_CODE:-none}"
          echo "[llm-probe] bytes=$(wc -c < "$BODY_FILE")"
          if [ -s "$CURL_ERR" ]; then
            echo "[llm-probe] curl stderr:"
            head -c 300 "$CURL_ERR" | tr -d '\r' | redact | sed 's/^/    /'
          fi
          echo "[llm-probe] response_head:"
          head -c 400 "$BODY_FILE" | tr -d '\r' | redact | sed 's/^/    /'
          echo
          if head -c 200 "$BODY_FILE" | grep -qiE '<!doctype|<html|<head|<body'; then
            echo "[llm-probe] VERDICT: HTML page returned -- provider/relay is not answering as an OpenAI API."
          else
            echo "[llm-probe] VERDICT: response is not HTML (inspect the head above for API errors)."
          fi
          rm -f "$BODY_FILE" "$CURL_ERR"

          # 用同一把 key 去问几个候选 provider「你认识它吗」，直接定位密钥属于哪家，
          # 省掉「base_url 和 key 不匹配」这类只能靠试的排查（2026-09-16 就是这么坏的）。
          echo "[llm-probe] key acceptance across candidate endpoints (GET {base}/models):"
          for candidate in \
            "$OPENAI_BASE_URL" \
            "https://www.fhl.mom/v1" \
            "https://open.bigmodel.cn/api/paas/v4" \
            "https://api.siliconflow.cn/v1" \
            "https://api.deepseek.com" ; do
            [ -z "$candidate" ] && continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              "${candidate%/}/models" 2>/dev/null || echo ERR)"
            host="$(printf '%s' "$candidate" | sed -E 's#^(https?://[^/]+).*#\1/...#')"
            printf '    %-6s %s\n' "$code" "$host"
          done
          echo "    (format: <http_status> <endpoint>; 401/403 = key not accepted there, 200 = key is valid there)"

          # 再问一遍同样几个 host，但用一把假 key：只为区分「这家根本不通/被墙」
          # 和「通了但不认这把 key」。JSON 401 = 通；HTML/超时/000 = 不通。
          echo "[llm-probe] candidate reachability with a dummy key (JSON 401 = reachable):"
          for candidate in \
            "https://open.bigmodel.cn/api/paas/v4" \
            "https://api.siliconflow.cn/v1" \
            "https://api.deepseek.com" ; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
              -H "Authorization: Bearer sk-dummy-reachability-probe" \
              "${candidate%/}/models" 2>/dev/null || echo ERR)"
            host="$(printf '%s' "$candidate" | sed -E 's#^(https?://[^/]+).*#\1/...#')"
            printf '    %-6s %s\n' "$code" "$host"
          done

      - name: Install Playwright chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Note on removed Docker AI services
        # 2026-09-18：原来这里有三步（docker compose up + 健康检查 + 建 Letta agent），
        # 已整体删除。DeerFlow / Prompt-Optimizer 只被健康检查调用、从不干活，
        # Letta 只是可选记忆且其 agent 模型名与端点错配。删除后每个 job 省 1~2 分钟。
        run: |
          echo "Docker AI services (deerflow / letta / prompt-optimizer) are disabled."
          echo "DEERFLOW_ENABLED=${DEERFLOW_ENABLED} LETTA_ENABLED=${LETTA_ENABLED} PROMPT_OPTIMIZER_ENABLED=${PROMPT_OPTIMIZER_ENABLED}"
          echo "Content generation does not depend on any of them; the pipeline degrades gracefully."

      - name: Restore publish history cache
        # ⚠️ 2026-09-18：选题池必须跨 run 保留，否则云端每次都是空池。
        # 每个 job 都是全新 runner，collect_topics 产出的 daily_topics.json 随
        # job 结束即消失；下一个 cron 的 job 起手就没有池子，直接走
        # 「daily_topics.json is missing or empty → 长青选题兜底」，
        # 于是云端选题脱离热点、永远只发常青稿。本地因为一直落盘所以没这问题。
        # （注释写在这里而不是 path 块内，避免被当成 glob 模式。）
        uses: actions/cache@v4
        with:
          path: |
            output/accounts/*/publish_history.json
            output/publish_history.json
            output/accounts/*/wechat_publish_history.json
            output/accounts/*/automation/last_daily_run_result.json
            output/automation/last_daily_run_result.json
            output/accounts/*/daily_topics.json
            output/daily_topics.json
            output/accounts/*/growth_checkpoints.json
            output/growth_checkpoints.json
            output/accounts/*/growth_feedback.json
            output/growth_feedback.json
            output/accounts/*/creative_score_calibration.json
            output/creative_score_calibration.json
          key: daily-publish-history-${{ github.ref_name }}-${{ steps.resolve-account-paths.outputs.ACCOUNT_SLUG }}-${{ github.run_id }}
          restore-keys: |
            daily-publish-history-${{ github.ref_name }}-${{ steps.resolve-account-paths.outputs.ACCOUNT_SLUG }}-

      - name: Restore notification log cache
        # Keep the ServerChan daily de-duplication state across ephemeral
        # runners and across the main/fallback jobs of this workflow.
        uses: actions/cache@v4
        with:
          path: |
            output/accounts/*/automation/notification_log.jsonl
            output/automation/notification_log.jsonl
          key: daily-notification-log-${{ github.ref_name }}-${{ github.run_id }}-primary
          restore-keys: |
            daily-notification-log-${{ github.ref_name }}-

      - name: Restore browser profile cache
        uses: actions/cache@v4
        with:
          path: .runtime/
          key: browser-profile-${{ github.ref_name }}-${{ steps.resolve-account-paths.outputs.ACCOUNT_SLUG }}-${{ github.run_number }}
          restore-keys: |
            browser-profile-${{ github.ref_name }}-${{ steps.resolve-account-paths.outputs.ACCOUNT_SLUG }}-

      - name: Seed browser profiles from release
        run: |
          NEED_SEED=false
          # 根据账号动态确定 toutiao profile 路径
          # This path comes from config.yaml. Account keys may use underscores
          # while their on-disk slugs use hyphens.
          REQUIRED_PROFILES="$TOUTIAO_PROFILE_DIR"
          WECHAT_PROFILE_DIR="$WECHAT_BROWSER_PROFILE_DIR"
          REQUIRED_PROFILES="$REQUIRED_PROFILES $WECHAT_PROFILE_DIR"
          echo "WECHAT_PROFILE_DIR=$WECHAT_PROFILE_DIR" >> "$GITHUB_ENV"
          for profile in $REQUIRED_PROFILES; do
            if [ ! -d "$profile" ] || [ -z "$(ls -A $profile 2>/dev/null)" ]; then
              echo "Profile $profile is missing or empty, need seed."
              NEED_SEED=true
              break
            fi
            # Check if Cookies file is older than 7 days
            COOKIE_FILE=$(find "$profile" -name "Cookies" -type f 2>/dev/null | head -1)
            if [ -n "$COOKIE_FILE" ]; then
              COOKIE_AGE_DAYS=$(( ($(date +%s) - $(stat -c %Y "$COOKIE_FILE" 2>/dev/null || echo 0)) / 86400 ))
              if [ "$COOKIE_AGE_DAYS" -gt 7 ]; then
                echo "Profile $profile: Cookies file is ${COOKIE_AGE_DAYS} days old, refreshing from seed."
                NEED_SEED=true
                break
              fi
            fi
          done
          if [ "$NEED_SEED" = "true" ]; then
            echo "Downloading seed from release..."
            echo "Toutiao profile dir for account '$RUN_ACCOUNT': $TOUTIAO_PROFILE_DIR"
            # 清理可能存在的旧 profile(default 路径 + 账号子目录)
            # Only clear the exact profiles used by this run. The account slug
            # may differ from the account key (robot_notes -> robot-notes).
            rm -rf "$TOUTIAO_PROFILE_DIR" "$WECHAT_PROFILE_DIR"
            gh release download browser-profiles-v1 --repo Lishoulan/Automated-workflow --pattern "browser_profiles_seed.tar.gz" --dir /tmp/
            mkdir -p .runtime
            tar xzf /tmp/browser_profiles_seed.tar.gz -C .runtime/
            echo "Browser profiles seeded successfully."
            echo "Verifying seeded toutiao profile:"
            if [ -d "$TOUTIAO_PROFILE_DIR" ]; then
              echo "  OK: $TOUTIAO_PROFILE_DIR exists"
              find "$TOUTIAO_PROFILE_DIR" -name "Cookies*" -type f -exec stat -c "%n size=%s mtime=%y" {} \; 2>/dev/null || echo "  No Cookies files found"
            else
              echo "  WARNING: $TOUTIAO_PROFILE_DIR not found after seed!"
              ls -la .runtime/
            fi
          else
            echo "All browser profiles found in cache and cookies are fresh, skipping seed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject cross-platform cookies
        run: |
          echo "Checking for exported cookies (account=$RUN_ACCOUNT)..."
          # ⚠️ 2026-09-18：这里原来下载**固定名字** exported_cookies.json 并注入给当次账号。
          # 单账号没问题，但多账号时两个账号会共享同一个 cookie 文件 —— 等于把 A 账号的
          # 登录态注进 B 账号。现在按账号找专属资产，找不到才回退 legacy 名字
          # （robot_notes 目前依赖 legacy，不能直接删）。
          COOKIES_FILE=""
          ASSET_NAMES=$(python scripts/resolve_cookie_asset.py --account "$RUN_ACCOUNT")
          echo "Candidate cookie assets:"
          echo "$ASSET_NAMES" | sed 's/^/  - /'
          for ASSET_NAME in $ASSET_NAMES; do
            ASSET_URL=$(gh api "repos/Lishoulan/Automated-workflow/releases/tags/browser-profiles-v1" \
                --jq ".assets[] | select(.name==\"$ASSET_NAME\") | .url" 2>/dev/null)
            if [ -z "$ASSET_URL" ]; then
              echo "  $ASSET_NAME: not present in the release, trying next."
              continue
            fi
            gh api "$ASSET_URL" -H "Accept: application/octet-stream" > /tmp/exported_cookies.json 2>/dev/null
            if [ -s /tmp/exported_cookies.json ]; then
              COOKIES_FILE="/tmp/exported_cookies.json"
              echo "Downloaded cookies from Release asset: $ASSET_NAME"
              EXPORTED_AT=$(python -c "import json; print(json.load(open('/tmp/exported_cookies.json')).get('exported_at','unknown'))" 2>/dev/null || echo "parse_error")
              echo "Cookie exported_at: $EXPORTED_AT"
              ACCOUNT_OF_COOKIES=$(python -c "import json; print(json.load(open('/tmp/exported_cookies.json')).get('account','unknown'))" 2>/dev/null || echo "unknown")
              echo "Cookie account field: $ACCOUNT_OF_COOKIES"
              if [ "$ASSET_NAME" = "exported_cookies.json" ] && [ "$RUN_ACCOUNT" != "default" ]; then
                echo "::warning::Falling back to the shared legacy cookie asset for account=$RUN_ACCOUNT. Upload exported_cookies_$(python scripts/resolve_cookie_asset.py --account "$RUN_ACCOUNT" --format primary | sed 's/^exported_cookies_//; s/\.json$//').json to the release to give this account its own login state."
              fi
              break
            fi
            echo "  $ASSET_NAME: downloaded but empty, trying next."
          done
          # API 下载失败时,回退到本地缓存
          if [ -z "$COOKIES_FILE" ] && [ -f ".runtime/automation/exported_cookies.json" ]; then
            COOKIES_FILE=".runtime/automation/exported_cookies.json"
            echo "WARNING: Using cached cookies (Release API download failed)."
          fi
          if [ -n "$COOKIES_FILE" ]; then
            echo "Injecting cookies from: $COOKIES_FILE"
            # 复制到 .runtime/automation/ 供后续服务运行时注入使用
            mkdir -p .runtime/automation
            cp "$COOKIES_FILE" .runtime/automation/exported_cookies.json 2>/dev/null || true
            # 同时复制到账号对应的目录，供 cloud_daily_run 降级流程的 _resolve_cookies_file 查找
            mkdir -p "$ACCOUNT_RUNTIME_DIR/automation"
            cp "$COOKIES_FILE" "$ACCOUNT_RUNTIME_DIR/automation/exported_cookies.json" 2>/dev/null || true
            echo "Also copied cookies to $ACCOUNT_RUNTIME_DIR/automation/exported_cookies.json"
            echo "Verifying cookie file copy..."
            ls -la .runtime/automation/exported_cookies.json 2>/dev/null || echo "WARNING: cookie file not found at .runtime/automation/"
            if python scripts/inject_cookies.py --input "$COOKIES_FILE" --headless \
              --account "$RUN_ACCOUNT"; then
              echo "Cookie injection succeeded."
            else
              echo "ERROR: Cookie injection failed."
              # 仅在自动发布启用时终止(避免健康检查阻塞);止血模式(autopublish=0)继续执行内容生成
              if [ "$TOUTIAO_AUTO_PUBLISH" = "1" ]; then
                echo "TOUTIAO_AUTO_PUBLISH=1, aborting to avoid health check block downstream."
                exit 1
              else
                echo "TOUTIAO_AUTO_PUBLISH=0, continuing (publish disabled, content generation only)."
              fi
            fi
          else
            echo "No exported cookies found, skipping injection."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug cookie file status
        run: |
          echo "=== Cookie file check ==="
          for dir in "$TOUTIAO_PROFILE_DIR" "$WECHAT_PROFILE_DIR"; do
            echo "--- $dir ---"
            if [ -d "$dir" ]; then
              find "$dir" -name "Cookies*" -type f -exec stat -c "%n size=%s mtime=%y" {} \; 2>/dev/null || echo "No Cookies files"
            else
              echo "NOT FOUND"
            fi
          done
        continue-on-error: true

      - name: Get runner public IP
        run: |
          echo "=== Runner Public IP ==="
          RUNNER_IP=$(curl -s ifconfig.me)
          echo "Runner IP octets:"
          echo "$RUNNER_IP" | awk -F. '{print "O1="$1; print "O2="$2; print "O3="$3; print "O4="$4}'
          echo "Please add this IP to WeChat MP whitelist"
        continue-on-error: true

      - name: Keep browser sessions alive
        run: |
          echo "Refreshing browser cookies to prevent session expiry..."
          python scripts/keep_alive.py --headless --account "$RUN_ACCOUNT" || true
        continue-on-error: true

      - name: Run daily pipeline
        run: |
          ARGS=(--account "$RUN_ACCOUNT" --skip-browser-check)
          if [ "$RUN_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$RUN_FAST_MODE" = "true" ]; then
            ARGS+=(--fast-mode)
          fi
          if [ -n "${RUN_TOPIC_TITLE:-}" ]; then
            ARGS+=(--topic-title "$RUN_TOPIC_TITLE")
          fi
          python scripts/cloud_daily_run.py "${ARGS[@]}"

      - name: Run image API diagnostic
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.image_diagnostic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE="$ACCOUNT_OUTPUT_DIR/automation/last_daily_workflow_report.json"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::error::Daily workflow report not found: $REPORT_FILE"
            exit 1
          fi

          RUN_DIR="$(python - "$REPORT_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          final_attempt = report.get("final_attempt") or {}
          print(str(final_attempt.get("run_dir") or ""))
          PY
          )"
          if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then
            echo "::error::Image diagnostic run directory is unavailable: $RUN_DIR"
            exit 1
          fi

          RUN_DIR="$RUN_DIR" REPORT_FILE="$REPORT_FILE" python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          report = json.loads(Path(os.environ["REPORT_FILE"]).read_text(encoding="utf-8"))
          final_attempt = report.get("final_attempt") or {}
          publish_dir = run_dir / "publish"
          publish_dir.mkdir(parents=True, exist_ok=True)

          article_source = run_dir / "article.md"
          article_target = publish_dir / "article.md"
          if article_source.exists() and not article_target.exists():
              shutil.copyfile(article_source, article_target)

          meta_path = publish_dir / "publish_meta.json"
          if not meta_path.exists():
              title = str(
                  final_attempt.get("selected_title")
                  or final_attempt.get("topic_title")
                  or "图片接口诊断"
              ).strip()
              meta_path.write_text(
                  json.dumps(
                      {
                          "selected_title": title,
                          "selected_topic": {"title": str(final_attempt.get("topic_title") or title)},
                          "summary": "",
                      },
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )
          print(f"Prepared image diagnostic run: {run_dir}")
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/src" python main.py \
            --generate-images-run \
            --account "$RUN_ACCOUNT" \
            --run-dir "$RUN_DIR"

      - name: Run engagement agent
        if: env.ENGAGEMENT_ENABLED == '1'
        run: |
          echo "Running daily engagement agent..."
          python main.py --engagement --account "$RUN_ACCOUNT"
        continue-on-error: true

      - name: Mine engagement topics
        if: env.ENGAGEMENT_ENABLED == '1'
        run: |
          echo "Mining comments for topic ideas..."
          python main.py --engagement-mine-topics --account "$RUN_ACCOUNT"
        continue-on-error: true

      - name: Run monetization sync
        if: env.MONETIZATION_ENABLED == '1'
        run: |
          echo "Syncing monetization data..."
          python main.py --monetization-sync
        continue-on-error: true

      - name: Show matrix dashboard
        if: env.MATRIX_ENABLED == '1'
        run: |
          echo "Matrix operations dashboard:"
          python main.py --matrix-dashboard
        continue-on-error: true

      - name: Collect performance data
        if: env.PERFORMANCE_COLLECT_ENABLED == '1'
        run: |
          echo "Collecting performance data (views/likes/comments/shares)..."
          python main.py --collect-performance --account "$RUN_ACCOUNT"
        continue-on-error: true

      - name: Snapshot published-work growth
        if: always()
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/collect_growth_snapshot.py --account "${RUN_ACCOUNT:-robot_notes}"
          REPORT_FILE="$ACCOUNT_OUTPUT_DIR/daily_growth_report.md"
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      - name: Publish precheck report
        if: always()
        shell: bash
        run: |
          echo "=== Precheck Report ==="
          find .runtime -name "precheck_report.json" -exec cat {} \; 2>/dev/null || echo "No precheck report found"

      - name: Monthly review and iteration
        if: always()
        env:
          MONTHLY_REVIEW_ENABLED: ${{ env.MONTHLY_REVIEW_ENABLED }}
        shell: bash
        run: |
          if [ "$MONTHLY_REVIEW_ENABLED" = "0" ]; then
            echo "MONTHLY_REVIEW_ENABLED=0, skipping monthly review."
            exit 0
          fi
          echo "Running monthly review and iteration..."
          python main.py --monthly-review --account "$RUN_ACCOUNT" || echo "Monthly review failed (non-fatal)"
        continue-on-error: true

      - name: Extract run status
        id: extract-status
        if: always()
        shell: bash
        run: |
          # 尝试 account-aware 路径，再回退到默认路径
          RESULT_FILE=""
          if [ -f "$ACCOUNT_OUTPUT_DIR/automation/last_daily_run_result.json" ]; then
            RESULT_FILE="$ACCOUNT_OUTPUT_DIR/automation/last_daily_run_result.json"
          elif [ -f "output/automation/last_daily_run_result.json" ]; then
            RESULT_FILE="output/automation/last_daily_run_result.json"
          fi
          if [ -n "$RESULT_FILE" ]; then
            STATUS=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('status', 'unknown'))" 2>/dev/null || echo "unknown")
            ACCOUNT=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('account_key', '$RUN_ACCOUNT'))" 2>/dev/null || echo "$RUN_ACCOUNT")
            PUBLISH_STATUS=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('publish_status', ''))" 2>/dev/null || echo "")
            PUBLISH_PGC_ID=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('publish_pgc_id', ''))" 2>/dev/null || echo "")
            SELECTED_TITLE=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('selected_title', ''))" 2>/dev/null || echo "")
            WORKFLOW_STATUS=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('workflow_status', ''))" 2>/dev/null || echo "")
            WORKFLOW_ERROR_COUNT=$(python -c "import json; value=json.load(open('$RESULT_FILE')).get('workflow_errors', []); print(len(value) if isinstance(value, list) else 0)" 2>/dev/null || echo "0")

            # Older application versions wrote status=success even when a
            # platform publish failed. Treat the structured workflow report as
            # authoritative so the cloud job cannot silently claim success.
            if [ "$WORKFLOW_STATUS" = "platform_publish_failed" ] || [ "$WORKFLOW_ERROR_COUNT" -gt 0 ] && [ "$STATUS" = "success" ]; then
              STATUS="failed"
            elif [ "$WORKFLOW_STATUS" = "platform_partial_success" ] && [ "$STATUS" = "success" ]; then
              STATUS="partial_success"
            fi

            echo "run-status=$STATUS" >> $GITHUB_OUTPUT
            echo "run-account=$ACCOUNT" >> $GITHUB_OUTPUT
            echo "publish-status=$PUBLISH_STATUS" >> $GITHUB_OUTPUT
            echo "publish-pgc-id=$PUBLISH_PGC_ID" >> $GITHUB_OUTPUT
            echo "selected-title=$SELECTED_TITLE" >> $GITHUB_OUTPUT
            echo "workflow-status=$WORKFLOW_STATUS" >> $GITHUB_OUTPUT
            echo "RUN_STATUS=$STATUS" >> "$GITHUB_ENV"
            echo "RUN_WORKFLOW_STATUS=$WORKFLOW_STATUS" >> "$GITHUB_ENV"
            echo "RUN_PUBLISH_STATUS=$PUBLISH_STATUS" >> "$GITHUB_ENV"
            echo "RUN_PUBLISH_PGC_ID=$PUBLISH_PGC_ID" >> "$GITHUB_ENV"
            if [ "$STATUS" = "degraded_to_draft" ]; then
              echo "::warning::定时任务降级为草稿模式（publish_status=draft_saved），文章未发布到头条公域。请检查 precheck_report.json 确认降级原因。"
            fi
            if [ "$PUBLISH_STATUS" = "submitted_for_review" ] && [ -n "$PUBLISH_PGC_ID" ]; then
              echo "::notice::头条发布成功 | 账号=$ACCOUNT | 标题=$SELECTED_TITLE | pgc_id=$PUBLISH_PGC_ID"
            fi
            if [ "$STATUS" = "success" ] && [ "$PUBLISH_STATUS" != "submitted_for_review" ] && [ -n "$PUBLISH_STATUS" ]; then
              echo "::warning::workflow 标记 success 但 publish_status=$PUBLISH_STATUS（非 submitted_for_review），文章可能未成功发布到头条公域。请检查 publish_result.json。"
            fi
            if [ "$PUBLISH_STATUS" = "submitted_for_review" ] && [ -z "$PUBLISH_PGC_ID" ]; then
              echo "::warning::publish_status=submitted_for_review 但 pgc_id 为空，发布可能未真正成功。请检查 publish_result.json 的 backend_response_summary。"
            fi
          else
            # 主 job 在 pipeline 运行前失败（如 cookie 注入阶段），使用实际运行账号而非硬编码 default
            echo "run-status=unknown" >> $GITHUB_OUTPUT
            echo "run-account=${RUN_ACCOUNT:-default}" >> $GITHUB_OUTPUT
            echo "RUN_STATUS=unknown" >> "$GITHUB_ENV"
          fi

      - name: Record cross-channel publish state
        if: always()
        shell: bash
        run: |
          # 把「今天发了什么」写进 state/daily_publish_state.json，供本地通道做跨通道
          # 互斥（云端与本地 publish_history 互不可见，否则同一天会各发一篇）。
          python scripts/record_cloud_publish_state.py \
            --account "${RUN_ACCOUNT:-default}" \
            --account-output-dir "${ACCOUNT_OUTPUT_DIR:-}" \
            || echo "Cross-channel state write failed (non-fatal)"
        continue-on-error: true

      - name: Publish cross-channel state to the publish-state branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只把 state/ 下这一个文件写到独立分支 publish-state，不碰 main，
          # 也不影响本地仓库的工作区（本地读 origin/publish-state 里的同一文件）。
          if [ ! -f state/daily_publish_state.json ]; then
            echo "No cross-channel state file produced; skipping."
            exit 0
          fi
          STATE_REF="repos/${GITHUB_REPOSITORY}/contents/state/daily_publish_state.json"
          STATE_SHA=$(gh api "${STATE_REF}?ref=publish-state" -q .sha 2>/dev/null || echo "")
          if [ -z "$STATE_SHA" ]; then
            # 分支还不存在时先建出来（contents API 不会自动创建新分支）。
            echo "Branch publish-state missing; creating it from the default branch."
            BASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_DEFAULT_BRANCH:-main}" -q .object.sha 2>/dev/null || echo "")
            if [ -n "$BASE_SHA" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/publish-state" -f sha="$BASE_SHA" > /dev/null 2>&1 || true
            fi
          fi
          echo "Existing state sha: ${STATE_SHA:-<none, will create>}"
          STATE_SHA="$STATE_SHA" python - <<'PY' > /tmp/state_payload.json
          import base64, json, os
          with open("state/daily_publish_state.json", "rb") as handle:
              content = base64.b64encode(handle.read()).decode()
          payload = {
              "message": "chore(state): record daily publish state [skip ci]",
              "content": content,
              "branch": "publish-state",
          }
          sha = os.environ.get("STATE_SHA", "").strip()
          if sha:
              payload["sha"] = sha
          print(json.dumps(payload))
          PY
          gh api -X PUT "${STATE_REF}" --input /tmp/state_payload.json > /dev/null \
            && echo "Cross-channel state published to branch publish-state." \
            || echo "Failed to publish cross-channel state (non-fatal)."
        continue-on-error: true

      - name: Enforce publish result
        if: always()
        shell: bash
        run: |
          if [ "$RUN_PUBLISH_TOUTIAO" != "true" ] && [ "$RUN_PUBLISH_WECHAT_VIA_135" != "true" ]; then
            echo "No automatic platform publish was requested; content-only run is allowed."
            exit 0
          fi
          if [ "$RUN_PUBLISH_TOUTIAO" = "true" ] && { [ "${RUN_PUBLISH_STATUS:-}" != "submitted_for_review" ] || [ -z "${RUN_PUBLISH_PGC_ID:-}" ]; }; then
            echo "::error::Toutiao publish was requested but no accepted submission with pgc_id was recorded: status=${RUN_PUBLISH_STATUS:-missing}"
            exit 1
          fi
          case "${RUN_STATUS:-unknown}" in
            failed|partial_success|publish_login_required|publish_uncertain|degraded_to_draft)
              echo "::error::Automatic publish did not complete: status=${RUN_STATUS}, workflow_status=${RUN_WORKFLOW_STATUS:-unknown}"
              exit 1
              ;;
            *)
              echo "Automatic publish result accepted: status=${RUN_STATUS:-unknown}"
              ;;
          esac

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_number }}
          path: |
            output/
            logs/
            .runtime/*/debug/
            .runtime/debug/
            .runtime/automation/*report*.json
            .runtime/accounts/*/debug/
            .runtime/accounts/*/automation/*report*.json
          retention-days: 7

      - name: Update browser profile seed
        # A cloud runner is not a trusted source for a fresh login profile.
        # Seed assets are refreshed locally and uploaded only after re-login.
        if: ${{ false }}
        run: |
          echo "Updating browser profile seed with fresh cookies..."
          PYTHONUTF8=1 python scripts/pack_browser_profiles.py --account "$RUN_ACCOUNT" || true
          if [ -f "browser_profiles_seed.tar.gz" ]; then
            echo "Uploading updated profile seed to GitHub Release..."
            gh release upload browser-profiles-v1 browser_profiles_seed.tar.gz --clobber --repo Lishoulan/Automated-workflow
            echo "Profile seed updated successfully."
          else
            echo "No profile seed generated, skipping upload."
          fi
          # 注意：不在云端重新导出 cookies，因为云端 session 可能已过期
          # cookies 应由用户本地运行 export_cookies.py 后手动上传到 Release
          echo "Skipping cloud cookie export to preserve fresh local cookies."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 备用 job：主 job 失败或被 blocked 时以草稿模式重跑，保证至少产出草稿内容
  daily-run-fallback:
    needs: daily-run
    if: >-
      needs.daily-run.result == 'failure' &&
      (needs.daily-run.outputs.run-status == '' ||
       needs.daily-run.outputs.run-status == 'unknown' ||
       needs.daily-run.outputs.run-status == 'blocked')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ---- 敏感配置（从 GitHub Secrets 读取，与主 job 保持一致） ----
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_BASE_URL && secrets.OPENAI_MODEL || '' }}
      OPENAI_TEMPERATURE: ${{ secrets.OPENAI_TEMPERATURE || '0.7' }}
      # 与主 job 保持一致：标题环节使用免费模型（见主 job 同名变量说明）。
      OPENAI_TITLE_MODEL: ${{ secrets.OPENAI_TITLE_MODEL || 'glm-4-flash' }}
      TITLE_MODEL_EXPERIMENT: glm-4-flash-20260918

      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.OPENAI_API_KEY }}
      IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL || secrets.OPENAI_BASE_URL }}

      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}

      MD2WECHAT_API_KEY: ${{ secrets.MD2WECHAT_API_KEY }}

      WECHAT_SERV00_PROXY_URL: ${{ secrets.WECHAT_SERV00_PROXY_URL }}
      WECHAT_SERV00_PROXY_SECRET: ${{ secrets.WECHAT_SERV00_PROXY_SECRET }}

      TOUTIAO_PROXY_SERVER: ${{ secrets.TOUTIAO_PROXY_SERVER }}

      # ---- 非敏感配置（直接硬编码默认值） ----
      PYTHONUTF8: "1"
      # 时区固定为北京时间：让 datetime.now() 的「今日」与头条后台一致。
      # runner 默认是 UTC，会导致跨 0-8 点的时段把「今天」算成前一天
      # （count_today_published 的每日 1 篇上限由此失效/误判）。
      TZ: Asia/Shanghai
      TOUTIAO_ACCOUNT: default
      # 云端是内容生产通道，必须不设「本地兜底窗口」限制。
      # >=0 会让本地在当天该小时前不发布（见 services/cross_channel_state.py）。
      TOUTIAO_LOCAL_FALLBACK_AFTER_HOUR: "-1"

      # Image generation: image2 cover first; exact statistical inserts stay local.
      IMAGE_BACKEND: ${{ secrets.IMAGE_BACKEND || 'image2' }}
      IMAGE_API_MODE: ${{ secrets.IMAGE_API_MODE || 'images' }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_MAX_ASSETS: ${{ secrets.IMAGE_MAX_ASSETS || '2' }}
      IMAGE_COVER_SIZE: ${{ secrets.IMAGE_COVER_SIZE || '1536x1024' }}
      IMAGE_INFOGRAPHIC_SIZE: ${{ secrets.IMAGE_INFOGRAPHIC_SIZE || '1024x1536' }}
      IMAGE_QUALITY: ${{ secrets.IMAGE_QUALITY || 'high' }}
      IMAGE_STYLE: ${{ secrets.IMAGE_STYLE || 'vivid' }}
      IMAGE_BACKGROUND: ${{ secrets.IMAGE_BACKGROUND || 'opaque' }}
      IMAGE_REQUEST_TIMEOUT_SECONDS: ${{ secrets.IMAGE_REQUEST_TIMEOUT_SECONDS || '180' }}
      IMAGE_FALLBACK_TO_RENDERER: "1"

      # 内容生成
      ARTICLE_WORD_TARGET: ${{ secrets.ARTICLE_WORD_TARGET || '1800' }}
      MAX_INPUT_CHARS: ${{ secrets.MAX_INPUT_CHARS || '16000' }}
      BRAND_NAME: ${{ secrets.BRAND_NAME || '' }}
      INDUSTRY_FOCUS: ${{ secrets.INDUSTRY_FOCUS || '' }}
      TARGET_PLATFORM: ${{ secrets.TARGET_PLATFORM || 'all' }}
      TARGET_AUDIENCE: ${{ secrets.TARGET_AUDIENCE || '' }}
      DEFAULT_STYLE: ${{ secrets.DEFAULT_STYLE || 'deep_industry_analysis' }}
      TITLE_COUNT: ${{ secrets.TITLE_COUNT || '20' }}
      RECOMMENDED_TITLE_COUNT: ${{ secrets.RECOMMENDED_TITLE_COUNT || '3' }}
      CACHE_SIMILARITY_THRESHOLD: ${{ secrets.CACHE_SIMILARITY_THRESHOLD || '0.82' }}
      LOG_LEVEL: INFO

      # 头条发布（备用 job 强制草稿模式，不发布）
      TOUTIAO_PUBLISH_ENABLED: "1"
      TOUTIAO_AUTO_PUBLISH: "0"
      TOUTIAO_DRAFT_ONLY: "1"
      TOUTIAO_PUBLISH_DRAFT_ONLY: "1"
      TOUTIAO_MAX_DAILY_TOPIC_ATTEMPTS: ${{ secrets.TOUTIAO_MAX_DAILY_TOPIC_ATTEMPTS || '6' }}
      TOUTIAO_AIGC_DECLARATION_ENABLED: "1"
      TOUTIAO_PUBLISH_PLATFORM: toutiao
      TOUTIAO_PUBLISH_BASE_URL: https://mp.toutiao.com/
      TOUTIAO_PUBLISH_URL: https://mp.toutiao.com/profile_v4/graphic/publish
      TOUTIAO_BROWSER_PROFILE_DIR: .runtime/toutiao_profile
      TOUTIAO_PUBLISH_CHANNEL: chromium
      TOUTIAO_PUBLISH_HEADLESS: "1"
      TOUTIAO_PUBLISH_TIMEOUT_MS: ${{ secrets.TOUTIAO_PUBLISH_TIMEOUT_MS || '15000' }}
      TOUTIAO_PUBLISH_HISTORY_FILE: publish_history.json
      TOUTIAO_ALLOW_DUPLICATE_TOPICS: "0"
      TOUTIAO_TITLE_MAX_LENGTH: "30"
      TOUTIAO_PUBLISH_COVER_MODE: ${{ secrets.TOUTIAO_PUBLISH_COVER_MODE || 'single' }}
      TOUTIAO_INLINE_IMAGES_ENABLED: ${{ secrets.TOUTIAO_INLINE_IMAGES_ENABLED || '1' }}

      # 微信发布（备用 job 不发布）
      WECHAT_ENABLED: "0"
      WECHAT_AUTO_PUBLISH: "0"
      WECHAT_ACCOUNT_NAME: ${{ secrets.WECHAT_ACCOUNT_NAME || '' }}
      WECHAT_AUTHOR_NAME: ${{ secrets.WECHAT_AUTHOR_NAME || '手蓝' }}
      WECHAT_BASE_URL: https://mp.weixin.qq.com/
      WECHAT_API_BASE_URL: https://api.weixin.qq.com
      WECHAT_TITLE_MAX_LENGTH: "64"
      WECHAT_DIGEST_MAX_LENGTH: "120"
      WECHAT_HISTORY_FILENAME: wechat_publish_history.json
      WECHAT_COVER_STRATEGY: ${{ secrets.WECHAT_COVER_STRATEGY || 'text_cover' }}
      WECHAT_LAYOUT_BACKEND: ${{ secrets.WECHAT_LAYOUT_BACKEND || 'builtin' }}
      WECHAT_MD2WECHAT_ENABLED: ${{ secrets.WECHAT_MD2WECHAT_ENABLED || '0' }}
      WECHAT_SERV00_PROXY_ENABLED: ${{ secrets.WECHAT_SERV00_PROXY_ENABLED || '0' }}
      # 135 Editor is intentionally disabled in the fallback job as well.
      WECHAT_EDITOR_135_ENABLED: "0"
      WECHAT_BROWSER_PROFILE_DIR: .runtime/wechat_profile

      # 抖音发布（备用 job 不发布）
      DOUYIN_ENABLED: "0"
      DOUYIN_AUTO_PUBLISH: "0"
      DOUYIN_NICHE: ${{ secrets.DOUYIN_NICHE || '' }}
      DOUYIN_PUBLISH_MODE: browser
      DOUYIN_DAILY_POST_TARGET: ${{ secrets.DOUYIN_DAILY_POST_TARGET || '3' }}
      DOUYIN_BASE_URL: https://creator.douyin.com/
      DOUYIN_PUBLISH_URL: https://creator.douyin.com/creator-micro/content/upload
      DOUYIN_BROWSER_PROFILE_DIR: .runtime/douyin_profile
      DOUYIN_PUBLISH_CHANNEL: chromium
      DOUYIN_PUBLISH_HEADLESS: "1"
      DOUYIN_PUBLISH_TIMEOUT_MS: ${{ secrets.DOUYIN_PUBLISH_TIMEOUT_MS || '20000' }}
      DOUYIN_PUBLISH_HISTORY_FILE: douyin_publish_history.json
      DOUYIN_TITLE_MAX_LENGTH: "30"
      DOUYIN_CAPTION_MAX_LENGTH: "220"
      DOUYIN_MAX_IMAGES: "3"

      # MD2WeChat
      MD2WECHAT_BASE_URL: ${{ secrets.MD2WECHAT_BASE_URL || 'https://www.md2wechat.com/api/v1' }}
      MD2WECHAT_THEME: ${{ secrets.MD2WECHAT_THEME || 'default' }}
      MD2WECHAT_FONT_SIZE: ${{ secrets.MD2WECHAT_FONT_SIZE || 'medium' }}
      MD2WECHAT_CONVERT_VERSION: ${{ secrets.MD2WECHAT_CONVERT_VERSION || 'v1' }}
      MD2WECHAT_FALLBACK_TO_BUILTIN: "1"

      # 快速模式（备用 job 默认快速模式）
      TOUTIAO_FAST_MODE: ${{ secrets.TOUTIAO_FAST_MODE || '1' }}
      TOUTIAO_SKIP_IMAGE_GENERATION: ${{ secrets.TOUTIAO_SKIP_IMAGE_GENERATION || '0' }}
      TOUTIAO_SKIP_REVIEW_AGENT: ${{ secrets.TOUTIAO_SKIP_REVIEW_AGENT || '0' }}
      TOUTIAO_SKIP_PUBLISH_REVIEW: ${{ secrets.TOUTIAO_SKIP_PUBLISH_REVIEW || '0' }}
      TOUTIAO_REVIEW_MIN_OVERALL_SCORE: ${{ secrets.TOUTIAO_REVIEW_MIN_OVERALL_SCORE || '72' }}
      TOUTIAO_REVIEW_MAX_AI_RISK: ${{ secrets.TOUTIAO_REVIEW_MAX_AI_RISK || '45' }}
      # 自动发布的四个门槛必须与本地 .env 完全一致，否则云端会挑出和本地不同的稿子
      # （历史差异：云端 overall>=80 / readiness>=70，本地是 70 / 60）。
      # 每次运行的日志里会打印实际生效值（Report effective auto-publish gate）。
      TOUTIAO_AUTO_PUBLISH_MIN_OVERALL_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_OVERALL_SCORE || '70' }}
      TOUTIAO_AUTO_PUBLISH_MAX_AI_RISK: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MAX_AI_RISK || '40' }}
      TOUTIAO_AUTO_PUBLISH_MIN_VALIDATION_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_VALIDATION_SCORE || '80' }}
      TOUTIAO_AUTO_PUBLISH_MIN_READINESS_SCORE: ${{ secrets.TOUTIAO_AUTO_PUBLISH_MIN_READINESS_SCORE || '60' }}
      TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_OVERALL_SCORE: ${{ secrets.TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_OVERALL_SCORE || '65' }}
      TOUTIAO_HOT_TOPIC_MAX_AUTO_PUBLISH_AI_RISK: ${{ secrets.TOUTIAO_HOT_TOPIC_MAX_AUTO_PUBLISH_AI_RISK || '50' }}
      TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_READINESS_SCORE: ${{ secrets.TOUTIAO_HOT_TOPIC_MIN_AUTO_PUBLISH_READINESS_SCORE || '50' }}

      # ---- 洞察增强功能配置 ----
      TOUTIAO_ENHANCED_INSIGHTS_ENABLED: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_ENABLED || '1' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_MULTI_SOURCE: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_MULTI_SOURCE || '0' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_HISTORICAL: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_HISTORICAL || '0' }}
      TOUTIAO_ENHANCED_INSIGHTS_USE_DATA_MINING: ${{ secrets.TOUTIAO_ENHANCED_INSIGHTS_USE_DATA_MINING || '0' }}
      TOUTIAO_EXPERT_COUNCIL_ENABLED: ${{ secrets.TOUTIAO_EXPERT_COUNCIL_ENABLED || '1' }}

      # ---- 新平台发布配置（AiToEarn 集成，备用 job 全部禁用） ----
      BILIBILI_ENABLED: ${{ secrets.BILIBILI_ENABLED || '0' }}
      ZHIHU_ENABLED: ${{ secrets.ZHIHU_ENABLED || '0' }}
      WEIBO_ENABLED: ${{ secrets.WEIBO_ENABLED || '0' }}
      XIAOHONGSHU_ENABLED: ${{ secrets.XIAOHONGSHU_ENABLED || '0' }}

      # ---- 性能数据回采配置 ----
      PERFORMANCE_COLLECT_ENABLED: ${{ secrets.PERFORMANCE_COLLECT_ENABLED || '0' }}

      # ---- Docker AI 服务配置（备用 job 不启动 Docker 服务，仅保留配置） ----
      DEERFLOW_ENABLED: "0"
      DEERFLOW_BASE_URL: "http://localhost:8001"
      LETTA_ENABLED: "0"
      LETTA_BASE_URL: "http://localhost:8283"
      LETTA_AGENT_ID: ${{ secrets.LETTA_AGENT_ID || '' }}
      PROMPT_OPTIMIZER_ENABLED: "0"
      PROMPT_OPTIMIZER_BASE_URL: "http://localhost:8501"
      RUFLO_ENABLED: "0"

      # ---- 发布结果通知 ----
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      NOTIFY_DAILY_LIMIT: ${{ secrets.NOTIFY_DAILY_LIMIT || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve fallback account
        shell: bash
        env:
          WORKFLOW_TOPIC_TITLE: ${{ github.event.inputs.topic_title }}
        run: |
          # 从主 job 输出获取账号，若缺失则回退到 CLOUD_DEFAULT_ACCOUNT secret，再回退到 default
          ACCOUNT="${{ needs.daily-run.outputs.run-account }}"
          if [ -z "$ACCOUNT" ] || [ "$ACCOUNT" = "unknown" ]; then
            ACCOUNT="${{ secrets.CLOUD_DEFAULT_ACCOUNT || 'default' }}"
          fi
          echo "RUN_ACCOUNT=$ACCOUNT" >> $GITHUB_ENV
          echo "TOUTIAO_ACCOUNT=$ACCOUNT" >> $GITHUB_ENV
          {
            echo "RUN_TOPIC_TITLE<<__TOPIC_TITLE__"
            echo "${WORKFLOW_TOPIC_TITLE:-}"
            echo "__TOPIC_TITLE__"
          } >> "$GITHUB_ENV"
          echo "Fallback account resolved: $ACCOUNT"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Restore notification log cache
        # The fallback job has its own runner, so it must restore the same
        # cross-run notification state explicitly. Its snapshot has a
        # different suffix because the primary job may already have saved
        # its cache key before this job starts.
        uses: actions/cache@v4
        with:
          path: |
            output/accounts/*/automation/notification_log.jsonl
            output/automation/notification_log.jsonl
          key: daily-notification-log-${{ github.ref_name }}-${{ github.run_id }}-fallback
          restore-keys: |
            daily-notification-log-${{ github.ref_name }}-${{ github.run_id }}-primary
            daily-notification-log-${{ github.ref_name }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run daily pipeline (draft-only fallback)
        run: |
          # 备用 job 强制草稿模式：不发布，仅生成内容到草稿箱
          ARGS=(--account "$RUN_ACCOUNT" --skip-browser-check --fast-mode)
          if [ -n "${RUN_TOPIC_TITLE:-}" ]; then
            ARGS+=(--topic-title "$RUN_TOPIC_TITLE")
          fi
          python scripts/cloud_daily_run.py "${ARGS[@]}"

      - name: Publish precheck report
        if: always()
        shell: bash
        run: |
          echo "=== Fallback Precheck Report ==="
          find .runtime -name "precheck_report.json" -exec cat {} \; 2>/dev/null || echo "No precheck report found"

      - name: Upload fallback artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-fallback-${{ github.run_id }}
          path: |
            output/
            logs/
            .runtime/*/debug/
            .runtime/debug/
            .runtime/automation/*report*.json
            .runtime/accounts/*/debug/
            .runtime/accounts/*/automation/*report*.json
          retention-days: 7

  # 每日统一通知任务：只读取通知账本并发送一条汇总，不生成内容、不调用模型。
  daily-report:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUTF8: "1"
      TZ: Asia/Shanghai
      TOUTIAO_ACCOUNT: ${{ secrets.CLOUD_DEFAULT_ACCOUNT || 'default' }}
      LOG_LEVEL: INFO
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      BARK_URL: ${{ secrets.BARK_URL }}
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      NOTIFY_DAILY_LIMIT: ${{ secrets.NOTIFY_DAILY_LIMIT || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Restore notification log cache
        uses: actions/cache@v4
        with:
          path: |
            output/accounts/*/automation/notification_log.jsonl
            output/automation/notification_log.jsonl
          key: daily-notification-log-${{ github.ref_name }}-${{ github.run_id }}-report
          restore-keys: |
            daily-notification-log-${{ github.ref_name }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Send unified daily report
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python main.py \
            --send-daily-report \
            --account "$TOUTIAO_ACCOUNT"

      - name: Upload daily report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            output/accounts/*/automation/notification_log.jsonl
            output/automation/notification_log.jsonl
            logs/
          retention-days: 7
