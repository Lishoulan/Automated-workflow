name: WeChat Daily Run

on:
  schedule:
    # Beijing 07:17, with a 13:17 retry when no article passed review.
    - cron: '17 23 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check validates cloud login without writing or publishing an article'
        type: choice
        options: [check, publish]
        default: check
      retry_parent_run_id:
        description: 'Internal relay parent run and attempt'
        type: string
        default: ''
      refresh_session:
        description: 'Check-only: validate a refreshed administrator login seed instead of expired cached credentials'
        type: boolean
        default: false
      retry_day:
        description: 'Internal relay Beijing date'
        type: string
        default: ''
      validation_id:
        description: 'One-use operator-authorized formal-publication verification grant'
        type: string
        default: ''

concurrency:
  group: wechat-default
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  wechat:
    if: github.event_name == 'workflow_dispatch' || vars.WECHAT_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'glm-4-flash-250414' }}
      OPENAI_TITLE_MODEL: ${{ secrets.OPENAI_TITLE_MODEL || 'glm-4-flash' }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.OPENAI_API_KEY }}
      IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL || secrets.OPENAI_BASE_URL }}
      WECHAT_SESSION_KEY: ${{ secrets.WECHAT_SESSION_KEY }}
      WECHAT_SESSION_SEED: ${{ secrets.WECHAT_SESSION_SEED_DEFAULT }}
      WECHAT_SESSION_REFRESH: ${{ inputs.refresh_session == true && '1' || '0' }}
      RUN_MODE: ${{ inputs.mode || 'publish' }}
      WECHAT_RETRY_PARENT: ${{ inputs.retry_parent_run_id || '' }}
      WECHAT_RETRY_DAY: ${{ inputs.retry_day || '' }}
      WECHAT_VALIDATION_ID: ${{ inputs.validation_id || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and cloud browser
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Restore encrypted session and accepted history
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
          key: wechat-default-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wechat-default-v2-
            wechat-default-v1-
      - name: Validate login or run reviewed publication
        id: publish
        run: python scripts/wechat_cloud_run.py --account default --mode "$RUN_MODE"
      - name: Save refreshed encrypted session and accepted history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
          key: wechat-default-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize actual outcome
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = Path('output/automation/wechat_cloud_result.json')
          payload = json.loads(result.read_text(encoding='utf-8')) if result.exists() else {'status': 'setup_failed'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('WeChat cloud outcome: **' + str(payload.get('status', 'unknown')) + '**\n')
              if payload.get('status') == 'review_required':
                  handle.write('审核未通过，本次未发表。\n')
                  handle.write('原因：' + ', '.join(payload.get('reason_codes', [])) + '\n')
              elif payload.get('wechat_status') in ('submitted', 'submitted_for_review'):
                  handle.write('已提交微信，待平台审核；尚未确认正式发表。\n')
              elif payload.get('wechat_status') in ('published', 'success'):
                  handle.write('提交已返回，尚需核对后台记录与公开文章。\n')
              elif payload.get('wechat_status') == 'draft_saved':
                  handle.write('仅保存草稿，未发表。\n')
              handle.write('Login checks and review-required articles do not count as publications.\n')
              if payload.get('retry_status'):
                  handle.write('自动接力：' + str(payload['retry_status']) + '；当天运行 ' + str(payload.get('daily_run_count', '')) + ' 次，累计处理 ' + str(payload.get('daily_processing_seconds', '')) + ' 秒。\n')
                  handle.write(str(payload.get('retry_message', '')) + '\n')
              if payload.get('retry_state_error'):
                  handle.write('每日状态保存或接力触发失败：' + str(payload['retry_state_error']) + '；停止补跑。\n')
              if payload.get('manual_validation_id'):
                  handle.write('本次为用户明确授权的一次额外发表验证；保留实际计数与耗时，长期每日上限不变。\n')
              if payload.get('formal_publication_confirmed'):
                  handle.write('正式发表已确认：后台账号、标题、时间及公开正文匹配。\n')
              else:
                  handle.write('正式发表验收尚未完成。\n')
              if payload.get('metrics_error'):
                  handle.write('统计持久化失败：' + str(payload['metrics_error']) + '；保留真实发表结果及防重复状态。\n')
              for days, metrics in payload.get('metrics', {}).items():
                  rate = metrics.get('publication_rate')
                  review_rate = metrics.get('review_pass_rate')
                  handle.write(f"\n{days}天：正式发表 {metrics['confirmed_articles']}/{metrics['actual_publish_runs']}，发表率 " + (f'{rate:.1%}' if rate is not None else '暂无样本') + '\n')
                  handle.write(f"合格候选 {metrics['eligible_candidate_count']}；审核通过 {metrics['review_pass_count']}/{metrics['audited_candidate_count']}，通过率 " + (f'{review_rate:.1%}' if review_rate is not None else '暂无样本') + '\n')
                  handle.write('常见拒绝原因：' + json.dumps(metrics['common_rejection_reasons'], ensure_ascii=False) + '\n')
          PY
      - name: Save outcome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/automation/wechat_cloud_result.json
            output/automation/wechat_scheduled_result.json
            output/automation/wechat_login_check.json
            output/automation/wechat_review_diagnostics.json
            output/automation/wechat_metrics_report.json
            output/automation/wechat_publish_phase.json
          if-no-files-found: ignore
          retention-days: 14
