[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toutiao-content-factory"
version = "1.0.0"
description = "AI Toutiao content factory"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "Jinja2>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "playwright>=1.52.0",
    "psutil>=5.9.8",
]

[tool.setuptools.packages.find]
where = ["src"]
