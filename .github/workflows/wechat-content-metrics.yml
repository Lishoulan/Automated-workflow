name: WeChat Content Metrics

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      read_only:
        description: 'Collect backend evidence without updating the shared state'
        type: boolean
        default: false

concurrency:
  group: wechat-default
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  observe:
    if: vars.WECHAT_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      WECHAT_EXECUTION_HOST: cloud
      WECHAT_SESSION_KEY: ${{ secrets.WECHAT_SESSION_KEY }}
      WECHAT_SESSION_SEED: ${{ secrets.WECHAT_SESSION_SEED_DEFAULT }}
      TARGET_PLATFORM: wechat
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      GH_TOKEN: ${{ github.token }}
      READ_ONLY_CHECK: ${{ inputs.read_only == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and cloud browser
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Restore encrypted session and accepted history
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
            output/growth_ops/generation_costs/
          key: wechat-cloud-default-${{ vars.WECHAT_SESSION_CACHE_VERSION || 'v1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wechat-cloud-default-${{ vars.WECHAT_SESSION_CACHE_VERSION || 'v1' }}-
      - name: Read published article metrics
        id: collect
        run: |
          if [ "$READ_ONLY_CHECK" = "1" ]; then
            python scripts/collect_wechat_growth.py --read-only
          else
            python scripts/collect_wechat_growth.py
          fi
      - name: Save encrypted session and accepted history
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
            output/growth_ops/generation_costs/
          key: wechat-cloud-default-${{ vars.WECHAT_SESSION_CACHE_VERSION || 'v1' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-content-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/automation/wechat_growth_report.*
            output/automation/wechat_revenue_report.json
          if-no-files-found: ignore
          retention-days: 30
