<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&family=Space+Grotesk:wght@400;700&display=swap');

  :root {
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.15);
    --accent-glow: rgba(0,229,160,0.4);
    --text: #f0f2f5;
    --muted: rgba(240,242,245,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1200px;
    height: 675px;
    overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
    background: #0a0e17;
    color: var(--text);
    position: relative;
  }

  /* Mesh gradient background */
  .bg-mesh {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0,229,160,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 75%, rgba(0,180,255,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(120,80,255,0.06) 0%, transparent 70%),
      linear-gradient(170deg, #0a0e17 0%, #0f1525 40%, #0d1220 100%);
  }

  /* Grid overlay */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Decorative circles */
  .deco-circle-1 {
    position: absolute;
    width: 400px; height: 400px;
    border: 1px solid rgba(0,229,160,0.08);
    border-radius: 50%;
    top: -120px; right: -80px;
  }
  .deco-circle-2 {
    position: absolute;
    width: 250px; height: 250px;
    border: 1px solid rgba(0,180,255,0.06);
    border-radius: 50%;
    bottom: -60px; left: 60px;
  }
  .deco-circle-3 {
    position: absolute;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
    border-radius: 50%;
    top: 80px; right: 180px;
  }

  /* Content */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 80px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }
  .eyebrow::before {
    content: "";
    width: 28px; height: 2px;
    background: var(--accent);
    border-radius: 1px;
  }

  h1 {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.02em;
    max-width: 880px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 0%, #c8d0dc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 18px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--muted);
    max-width: 640px;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px;
    background: linear-gradient(0deg, rgba(10,14,23,0.9) 0%, transparent 100%);
    z-index: 3;
  }
  .brand {
    font-family: 'Space Grotesk', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .date-tag {
    font-family: 'Space Grotesk', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Accent line */
  .accent-line {
    position: absolute;
    left: 80px; bottom: 64px;
    width: 80px; height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    border-radius: 2px;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="grid-overlay"></div>
  <div class="deco-circle-1"></div>
  <div class="deco-circle-2"></div>
  <div class="deco-circle-3"></div>

  <div class="content">
    <div class="eyebrow">{{ eyebrow }}</div>
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>
  </div>

  <div class="accent-line"></div>
  <div class="bottom-bar">
    <span class="brand">{{ brand }}</span>
    <span class="date-tag">{{ date }}</span>
  </div>
</body>
</html>
