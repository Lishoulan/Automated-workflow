  title: 当日本机器人衰退，中国人形机器人却在东京机场撕开缺口
  run_dir: output/runs/20260516-112815_曾经全球第一的日本机器人-迎来-黄昏时刻
  observed_metrics:
    impression_count: 100000
    read_count: 2000
  keywords:
  - 日本机器人
  - 人形机器人
  - 东京机场
  - 产业转移
  notes:
  - 开头先给结论，再给关键数据和场景验证。
  - 用日本衰退对比中国交付能力，形成强冲突。
  - 重点落在产业链利润迁移，而不是泛泛讲技术。
  - 结尾抛出场景盈利判断，方便评论区互动。
  inferred_patterns:
  - 对比式开头
  - 数据锚点
  - 场景验证
  - 利润链条分析
  - 互动式收尾
