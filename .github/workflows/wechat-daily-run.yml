name: WeChat Daily Run

on:
  schedule:
    # Beijing 07:17, with a 13:17 retry when no article passed review.
    - cron: '17 23 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check validates cloud login without writing or publishing an article'
        type: choice
        options: [check, publish]
        default: check

concurrency:
  group: wechat-default
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wechat:
    if: github.event_name == 'workflow_dispatch' || vars.WECHAT_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'glm-4-flash-250414' }}
      OPENAI_TITLE_MODEL: ${{ secrets.OPENAI_TITLE_MODEL || 'glm-4-flash' }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.OPENAI_API_KEY }}
      IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL || secrets.OPENAI_BASE_URL }}
      WECHAT_SESSION_KEY: ${{ secrets.WECHAT_SESSION_KEY }}
      WECHAT_SESSION_SEED: ${{ secrets.WECHAT_SESSION_SEED_DEFAULT }}
      RUN_MODE: ${{ inputs.mode || 'publish' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and cloud browser
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Restore encrypted session and accepted history
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
            cache/
          key: wechat-default-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wechat-default-v1-
      - name: Validate login or run reviewed publication
        id: publish
        run: python scripts/wechat_cloud_run.py --account default --mode "$RUN_MODE"
      - name: Save refreshed encrypted session and accepted history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime/automation/wechat_cloud_session.enc
            output/wechat_publish_history.json
            cache/
          key: wechat-default-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize actual outcome
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = Path('output/automation/wechat_cloud_result.json')
          payload = json.loads(result.read_text(encoding='utf-8')) if result.exists() else {'status': 'setup_failed'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('WeChat cloud outcome: **' + str(payload.get('status', 'unknown')) + '**\n')
              handle.write('Login checks and review-required articles do not count as publications.\n')
          PY
      - name: Save outcome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/automation/wechat_cloud_result.json
            output/automation/wechat_scheduled_result.json
            output/automation/wechat_login_check.json
          if-no-files-found: ignore
          retention-days: 14
