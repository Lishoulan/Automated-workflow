config_version: 11

log_level: info

token_usage:
  enabled: true

models:
  - name: deepseek-v3
    display_name: DeepSeek V3
    use: langchain_openai:ChatOpenAI
    model: deepseek-chat
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
